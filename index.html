        /* Khung chìm siêu rõ nét (Sharp Sunken / Inset frame) */
        .frame-recessed {
            background: #e2e8f0;
            box-shadow: inset 3px 3px 6px rgba(15, 23, 42, 0.22), inset -3px -3px 6px rgba(255, 255, 255, 1);
            border: 1.5px solid #cbd5e1;
        }
        .frame-recessed-soft {
            background: #edf2f7;

            border: 1.5px solid #c7d2fe;
        }

        /* Nốt nổi siêu rõ nét (Sharp Raised / Embossed Node) */
        .frame-elevated {
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            box-shadow: 4px 6px 14px rgba(15, 23, 42, 0.16), 1px 2px 5px rgba(15, 23, 42, 0.08), -3px -3px 8px rgba(255, 255, 255, 1);

        .frame-elevated:hover {

            border-color: #c7d2fe;
        }
        .frame-elevated:active {
            box-shadow: inset 3px 3px 6px rgba(15, 23, 42, 0.22), inset -2px -2px 5px rgba(255, 255, 255, 1);
            transform: translateY(1px);
        }

        /* Gradient text utilities (Green theme / Xanh lá) */
