<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    
    <!-- Tarmac Gradient -->
    <linearGradient id="tarmacGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Jet Body Gradient -->
    <linearGradient id="jetGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Khaki Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8ba8e" />
      <stop offset="50%" stop-color="#c5a272" />
      <stop offset="100%" stop-color="#a88455" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <!-- Clip Path Circle -->
    <clipPath id="avatarClip">
      <circle cx="120" cy="120" r="114" />
    </clipPath>
  </defs>

  <!-- Circular Base Mask -->
  <g clip-path="url(#avatarClip)">
    <!-- Sky Background -->
    <rect x="0" y="0" width="240" height="155" fill="url(#skyGrad)" />
    
    <!-- Distant Mountains -->
    <path d="M 0 145 L 35 125 L 80 140 L 130 120 L 180 138 L 240 128 L 240 155 L 0 155 Z" fill="#94a3b8" opacity="0.4" />
    <path d="M 0 150 L 50 135 L 110 148 L 160 132 L 210 145 L 240 139 L 240 155 L 0 155 Z" fill="#64748b" opacity="0.3" />

    <!-- Tarmac Ground -->
    <rect x="0" y="150" width="240" height="90" fill="url(#tarmacGrad)" />
    <!-- Runway Yellow Line -->
    <line x1="10" y1="210" x2="230" y2="210" stroke="#facc15" stroke-width="4" stroke-dasharray="14 10" opacity="0.85" />
    <line x1="30" y1="165" x2="240" y2="165" stroke="#94a3b8" stroke-width="1.5" opacity="0.5" />

    <!-- PRIVATE JET BACKGROUND -->
    <!-- Jet Fuselage -->
    <path d="M 30 135 Q 90 95 180 85 Q 230 80 240 82 L 240 150 L 100 150 Z" fill="url(#jetGrad)" />
    <!-- Jet Cockpit / Windows -->
    <path d="M 195 86 Q 215 88 235 92 L 235 98 Q 215 94 195 91 Z" fill="#0f172a" opacity="0.9" />
    <circle cx="165" cy="98" r="4.5" fill="#0f172a" opacity="0.8" />
    <circle cx="148" cy="100" r="4.5" fill="#0f172a" opacity="0.8" />
    <circle cx="131" cy="102" r="4.5" fill="#0f172a" opacity="0.8" />
    
    <!-- Jet Passenger Doorway (Open Behind Huynh Hong) -->
    <rect x="65" y="102" width="28" height="48" rx="4" fill="#1e293b" />
    <rect x="68" y="105" width="22" height="42" rx="3" fill="#0f172a" />
    <line x1="93" y1="103" x2="93" y2="149" stroke="#94a3b8" stroke-width="1" />

    <!-- Jet Wing & Turbine Engine -->
    <path d="M 15 125 L 85 132 L 80 140 L 0 135 Z" fill="#cbd5e1" />
    <!-- Engine Nacelle -->
    <rect x="35" y="115" width="32" height="15" rx="6" fill="#e2e8f0" />
    <ellipse cx="36" cy="122.5" rx="3" ry="7" fill="#475569" />
    <line x1="40" y1="117" x2="63" y2="117" stroke="#3b82f6" stroke-width="1.5" />

    <!-- HUYNH HONG FOREGROUND PORTRAIT -->
    <!-- Torso / Lower Body (Beige Trousers) -->
    <path d="M 85 205 L 85 240 L 155 240 L 155 205 Z" fill="#b99566" />
    <line x1="120" y1="208" x2="120" y2="240" stroke="#8c6a3c" stroke-width="2" />
    <!-- Belt -->
    <rect x="88" y="202" width="64" height="6" rx="2" fill="#3f3f46" />
    <rect x="115" y="201" width="10" height="8" rx="1.5" fill="#fbbf24" />

    <!-- Inner Grey T-Shirt -->
    <path d="M 104 150 L 136 150 L 132 204 L 108 204 Z" fill="#94a3b8" />
    <path d="M 108 150 Q 120 157 132 150 Z" fill="#64748b" />

    <!-- Khaki Safari / Cargo Jacket -->
    <!-- Left Flap & Sleeve -->
    <path d="M 68 155 Q 85 142 106 148 L 109 208 L 82 210 L 62 185 Z" fill="url(#jacketGrad)" />
    <!-- Right Flap & Sleeve -->
    <path d="M 172 155 Q 155 142 134 148 L 131 208 L 158 210 L 178 185 Z" fill="url(#jacketGrad)" />
    
    <!-- Jacket Lapels / Collar -->
    <path d="M 106 148 L 115 175 L 105 180 L 102 150 Z" fill="#b89363" />
    <path d="M 134 148 L 125 175 L 135 180 L 138 150 Z" fill="#b89363" />
    
    <!-- Jacket Pockets & Stitching -->
    <rect x="84" y="172" width="18" height="15" rx="2" fill="#ad8857" stroke="#8c6a3c" stroke-width="0.8" />
    <rect x="138" y="172" width="18" height="15" rx="2" fill="#ad8857" stroke="#8c6a3c" stroke-width="0.8" />
    <circle cx="93" cy="175" r="1.5" fill="#d4d4d8" />
    <circle cx="147" cy="175" r="1.5" fill="#d4d4d8" />

    <!-- Black Shoulder Bag Strap -->
    <path d="M 80 148 L 152 225 L 146 228 L 76 152 Z" fill="#18181b" opacity="0.85" />
    <circle cx="114" cy="188" r="2.5" fill="#f59e0b" />

    <!-- Neck -->
    <rect x="110" y="132" width="20" height="22" rx="5" fill="url(#skinGrad)" />
    <path d="M 110 142 Q 120 148 130 142 Z" fill="#f97316" opacity="0.25" />

    <!-- Face Contour -->
    <path d="M 96 95 Q 96 138 120 140 Q 144 138 144 95 Q 144 68 120 68 Q 96 68 96 95 Z" fill="url(#skinGrad)" />

    <!-- Red Lips (Chic Smile) -->
    <path d="M 113 124 Q 120 128 127 124 Q 120 131 113 124 Z" fill="#dc2626" />
    <path d="M 115 124 Q 120 125 125 124" stroke="#991b1b" stroke-width="0.8" fill="none" />

    <!-- Nose -->
    <path d="M 120 108 L 118 116 L 122 116" stroke="#ea580c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />

    <!-- Eyes & Delicate Eyebrows -->
    <path d="M 106 97 Q 112 94 117 97" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <ellipse cx="111" cy="102" rx="3.5" ry="3" fill="#18181b" />
    <circle cx="112" cy="101" r="1" fill="#ffffff" />

    <path d="M 123 97 Q 128 94 134 97" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <ellipse cx="129" cy="102" rx="3.5" ry="3" fill="#18181b" />
    <circle cx="130" cy="101" r="1" fill="#ffffff" />

    <!-- Glasses (Stylish modern frames) -->
    <rect x="103" y="96" width="16" height="12" rx="3" stroke="#09090b" stroke-width="1.8" fill="none" opacity="0.9" />
    <rect x="121" y="96" width="16" height="12" rx="3" stroke="#09090b" stroke-width="1.8" fill="none" opacity="0.9" />
    <line x1="119" y1="101" x2="121" y2="101" stroke="#09090b" stroke-width="1.8" />
    <line x1="97" y1="100" x2="103" y2="100" stroke="#09090b" stroke-width="1.5" />
    <line x1="137" y1="100" x2="143" y2="100" stroke="#09090b" stroke-width="1.5" />

    <!-- Short Bob Hairstyle (Chin-length, parted) -->
    <!-- Hair Volume Back -->
    <path d="M 94 88 C 88 105 88 126 95 132 C 98 120 100 95 98 85 Z" fill="url(#hairGrad)" />
    <path d="M 146 88 C 152 105 152 126 145 132 C 142 120 140 95 142 85 Z" fill="url(#hairGrad)" />
    <!-- Hair Crown & Parting -->
    <path d="M 93 92 C 92 65 110 58 120 58 C 136 58 148 68 147 92 C 147 96 140 80 132 80 C 120 80 114 86 102 88 C 96 89 94 91 93 92 Z" fill="url(#hairGrad)" />
    <!-- Front Side Fringe -->
    <path d="M 94 88 C 98 100 101 114 99 125 C 96 112 95 100 94 88 Z" fill="#27272a" />
    <path d="M 146 88 C 142 100 139 114 141 125 C 144 112 145 100 146 88 Z" fill="#27272a" />
    <path d="M 112 68 C 117 76 122 84 125 90 C 120 84 115 76 112 68 Z" fill="#3f3f46" opacity="0.6" />
  </g>

  <!-- High-end Avatar Outer Border Ring -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="url(#skyGrad)" stroke-width="4" />
  <circle cx="120" cy="120" r="117" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
</svg>
